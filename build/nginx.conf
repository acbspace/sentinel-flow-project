# The dashboard is served from the same origin as the API: nginx serves the
# static bundle and proxies /v1 through to incidents-api. That is why the API
# needs no CORS handling and the app's fetch paths are identical in dev
# (Vite's proxy) and in production.

server {
    # Both families: the container's /etc/hosts maps localhost to ::1 as well as
    # 127.0.0.1, and the healthcheck's wget tries the IPv6 address first.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed responses matter more than usual here: this is opened during an
    # incident, sometimes on a phone, sometimes on hotel wifi.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /v1/ {
        proxy_pass http://incidents-api:8084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves people on the old app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
