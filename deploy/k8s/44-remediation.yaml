# The remediation worker: runs runbooks, pausing at approval-gated steps.
#
# Deliberately a separate workload from alerting: paging a human and acting on
# production are different blast radii, and this one should be independently
# scalable to zero if an operator wants automation off entirely.
apiVersion: v1
kind: Service
metadata:
  name: remediation
  namespace: sentinelflow
  labels:
    app.kubernetes.io/name: remediation
    app.kubernetes.io/part-of: sentinelflow
spec:
  selector:
    app.kubernetes.io/name: remediation
  ports:
    - name: http
      port: 8086
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation
  namespace: sentinelflow
  labels:
    app.kubernetes.io/name: remediation
    app.kubernetes.io/part-of: sentinelflow
spec:
  # Scale this to 0 to disable automated remediation entirely without touching
  # anything else: incidents still open, page and escalate as normal.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remediation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remediation
        app.kubernetes.io/part-of: sentinelflow
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: remediation
          image: sentinelflow/remediation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: HTTP_ADDR
              value: ":8086"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: sentinelflow-secrets, key: POSTGRES_DSN}
          envFrom:
            - configMapRef: {name: sentinelflow-config}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
