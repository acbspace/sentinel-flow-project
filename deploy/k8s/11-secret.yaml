# ============================================================================
# DEVELOPMENT PLACEHOLDERS ONLY.
#
# This file exists so `kubectl apply -f deploy/k8s/` brings up a working stack on
# a local cluster. The password below is the same throwaway value the Compose
# stack uses and is committed deliberately, exactly as .env.example is.
#
# Do not apply this to a cluster that matters. Real credentials belong in a
# sealed secret, an external secrets operator, or your cloud's secret manager --
# never in a manifest in git.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sentinelflow-secrets
  namespace: sentinelflow
  labels:
    app.kubernetes.io/part-of: sentinelflow
type: Opaque
stringData:
  POSTGRES_USER: "sentinelflow"
  POSTGRES_PASSWORD: "change-me-local-only"
  POSTGRES_DB: "sentinelflow"
  # Assembled here so no application manifest has to concatenate credentials.
  POSTGRES_DSN: "postgres://sentinelflow:change-me-local-only@postgres:5432/sentinelflow?sslmode=disable"
