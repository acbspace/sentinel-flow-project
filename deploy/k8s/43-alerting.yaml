# The alert worker: a Temporal worker plus the starter poller.
#
# No HPA. Temporal distributes workflow and activity tasks across whatever
# workers poll the task queue, so capacity here is a deliberate choice rather
# than something to autoscale on CPU -- and the poller's work is bounded by how
# many incidents open, not by request load.
apiVersion: v1
kind: Service
metadata:
  name: alerting
  namespace: sentinelflow
  labels:
    app.kubernetes.io/name: alerting
    app.kubernetes.io/part-of: sentinelflow
spec:
  selector:
    app.kubernetes.io/name: alerting
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerting
  namespace: sentinelflow
  labels:
    app.kubernetes.io/name: alerting
    app.kubernetes.io/part-of: sentinelflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alerting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerting
        app.kubernetes.io/part-of: sentinelflow
    spec:
      # The worker drains in-flight activities on SIGTERM.
      terminationGracePeriodSeconds: 45
      containers:
        - name: alerting
          image: sentinelflow/alerting:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          env:
            - name: HTTP_ADDR
              value: ":8085"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: sentinelflow-secrets, key: POSTGRES_DSN}
          envFrom:
            - configMapRef: {name: sentinelflow-config}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
